<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize o seu dia de forma simples</p>
    </header>

    <main>
        <div class="todo-container">
            <ul class="todo-list">
                <li class="todo-item">
                    <label class="task-content">
                        <input type="checkbox">
                        <span>Estudar estrutura de tags HTML5</span>
                    </label>
                    <button class="delete-btn" title="Excluir tarefa">&times;</button>
                </li>

                <li class="todo-item completed">
                    <label class="task-content">
                        <input type="checkbox" checked>
                        <span>Criar o design da lista no CSS</span>
                    </label>
                    <button class="delete-btn" title="Excluir tarefa">&times;</button>
                </li>
            </ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido com HTML e CSS</p>
    </footer>

</body>
</html>
