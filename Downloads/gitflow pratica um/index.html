<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Gerenciador de Tarefas</h1>
            <button id="theme-toggle" aria-label="Alternar modo escuro" title="Alternar tema">🌙 Mode</button>
        </div>
        <p>Organize o seu dia de forma simples</p>
    </header>

    <main>
        <div class="todo-container">

            <div class="add-form">
                <input type="text" id="task-input" placeholder="Nova tarefa..." autocomplete="off" />
                <button id="add-btn">Adicionar</button>
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="pending">Pendentes</button>
                <button class="filter-btn" data-filter="done">Concluídas</button>
            </div>

            <div id="spinner">
                <span class="spinner-circle"></span> Adicionando...
            </div>

            <ul class="todo-list"></ul>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido com HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
