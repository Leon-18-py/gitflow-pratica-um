<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas com Filtros (Sem JS)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gerenciador de Tarefas</h1>
        <p>Organize o seu dia de forma simples</p>
    </header>

    <main>
        <!-- CONTROLES DE FILTRO (Inputs invisíveis que controlam o CSS) -->
        <input type="radio" name="filter" id="filter-all" checked>
        <input type="radio" name="filter" id="filter-pending">
        <input type="radio" name="filter" id="filter-completed">

        <div class="todo-container">
            <!-- Formulário de envio para o servidor -->
            <form action="/adicionar-tarefa" method="POST" id="todo-form">
                <input type="text" name="nova_tarefa" id="task-input" placeholder="Digite uma nova tarefa..." required>
                <button type="submit" id="add-btn">Adicionar</button>
            </form>

            <!-- ABAS VISÍVEIS DE FILTRO -->
            <div class="filter-tabs">
                <label for="filter-all" class="tab-btn btn-all">Todas</label>
                <label for="filter-pending" class="tab-btn btn-pending">Pendentes</label>
                <label for="filter-completed" class="tab-btn btn-completed">Concluídas</label>
            </div>

            <ul class="todo-list">
                <!-- Tarefa 1 (Pendente de forma nativa) -->
                <!-- Adicionamos a classe 'task-pending' para o filtro do CSS -->
                <li class="todo-item task-pending">
                    <label class="task-content">
                        <input type="checkbox" id="task-1">
                        <span>Estudar estrutura de tags HTML5</span>
                    </label>
                </li>

                <!-- Tarefa 2 (Concluída de forma nativa) -->
                <!-- Adicionamos a classe 'task-completed' para o filtro do CSS -->
                <li class="todo-item task-completed">
                    <label class="task-content">
                        <input type="checkbox" id="task-2" checked>
                        <span>Criar o design da lista no CSS</span>
                    </label>
                </li>
            </ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Filtros inteligentes feitos apenas com CSS</p>
    </footer>

</body>
</html>
